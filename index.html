<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
 <meta name="description" content="A tip calculator that splits the bill and tip per person.">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="css/style.css">
  <title>Frontend Mentor | Tip calculator app</title>
  
  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  
</head>
<body>
  <main>
  <div class="container">
    <div class="header">
      <h1 class="visually-hidden">Tip calculator</h1>
<img src="/images/logo.svg" alt="" class="logo">
</div>

  <div class="header_body">
    <div class="control">
<label for="bill" class="bill">Bill</label>
<input type="number" id="bill" placeholder="0.00">

  <p class="tip-label" id="tip-label">Select Tip %</p>
  <div class="button_group" role="group" aria-labelledby="tip-label">
  <button class="tip_button" data-tip="5" aria-pressed="false">5%</button>
  <button class="tip_button" data-tip="10" aria-pressed="false">10%</button>
  <button class="tip_button" data-tip="15" aria-pressed="false">15%</button>
  <button class="tip_button" data-tip="25" aria-pressed="false">25%</button>
  <button class="tip_button" data-tip="50" aria-pressed="false">50%</button>
  <!-- <button class="custom">Custom</button> -->
  <input type="number" id="custom-tip" placeholder="Custom" aria-label="Custom tip percentage" min="0" step="any">
</div>  
  <label for="people" class="label_people">Number of People
    <span class="error_message" id="error_message" role="alert">Can't be zero</span>
  </label>
  <input type="number" id="people" placeholder="0"  min="1" step="1" inputmode="numeric"
       aria-describedby="error_message">
  </div>

<div class="results" >
  <div class="row" aria-live="polite" aria-atomic="true">
  <div class="label">
    <p class="label_amount">Tip Amount</p>
     <p class="label_person">/ person</p> 
      </div>
    <p class="amount" id="tip_amount">$4.27</p>
    </div>

    <div class="row" aria-live="polite" aria-atomic="true">
  <div class="total">
    <p class="label_total">Total</p>
    <p class="label_person">/ person</p>
    
  </div>
  <p class="amount" id="total_amount">$8.54</p>
  </div>
  <button id="reset">Reset</button>
</div>

  
  </div>
</div>
</main>
 <script src="script.js"></script>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
 
</body>
</html>
